services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optipdf-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      - STORAGE_DIR=/tmp/optipdf_ephemeral_store
      - CORS_ORIGINS=*
    volumes:
      - ./sample_pdfs:/sample_pdfs:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optipdf-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
